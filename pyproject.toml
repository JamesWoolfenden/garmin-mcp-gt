[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garmin-mcp-gt"
version = "0.1.7"
description = "Garmin Connect MCP server — exposes health and activity data as tools for Claude"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["garmin", "mcp", "claude", "health", "fitness", "cycling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
]
dependencies = [
    "garminconnect>=0.3.2,<0.4",
    # mcp 2.0 renamed FastMCP -> MCPServer and changed its import path
    # (mcp.server.fastmcp no longer exists); garmin_mcp.py is written against
    # the 1.x API. Pin below 2 until that migration happens deliberately.
    "mcp>=1.0.0,<2",
    "garmin-fit-sdk>=21.0.0",
]

[project.optional-dependencies]
dev = ["ruff==0.16.10", "pre-commit"]

[tool.ruff.lint]
# Explicit, pinned rule selection. Ruff's actual default rule set has grown
# across releases — flake8-datetimez (DTZ), flake8-bandit (S),
# flake8-blind-except (BLE), flynt (FLY), and refurb (FURB) checks all
# started firing here with zero code change, since "ruff" above was
# previously unpinned and uv.lock wasn't committed, so CI always installed
# whatever was latest on PyPI. main's CI was silently broken from sometime
# after 2026-06-14 until this was found on 2026-10-06. Pin to classic
# pyflakes + pycodestyle, which is what this codebase's naive dates and
# intentional broad excepts (fail one Garmin sub-fetch without breaking the
# whole response) were actually written against.
select = ["E4", "E7", "E9", "F"]

[project.scripts]
garmin-mcp = "garmin_mcp:main"
garmin-setup = "garmin_mcp:_setup"
garmin-upload-tokens = "garmin_mcp:_upload_tokens"

[project.urls]
Homepage = "https://github.com/JamesWoolfenden/garmin-mcp-gt"
Issues = "https://github.com/JamesWoolfenden/garmin-mcp-gt/issues"

[tool.hatch.build.targets.wheel]
include = ["garmin_mcp.py"]
