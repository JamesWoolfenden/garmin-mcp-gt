[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garmin-mcp-gt"
version = "0.1.3"
description = "Garmin Connect MCP server — exposes health and activity data as tools for Claude"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["garmin", "mcp", "claude", "health", "fitness", "cycling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
]
dependencies = [
    "garminconnect>=0.3.2,<0.4",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = ["ruff", "pre-commit"]

[project.scripts]
garmin-mcp = "garmin_mcp:main"
garmin-setup = "garmin_mcp:_setup"
garmin-upload-tokens = "garmin_mcp:_upload_tokens"

[project.urls]
Homepage = "https://github.com/JamesWoolfenden/garmin-mcp-gt"
Issues = "https://github.com/JamesWoolfenden/garmin-mcp-gt/issues"

[tool.hatch.build.targets.wheel]
include = ["garmin_mcp.py"]
