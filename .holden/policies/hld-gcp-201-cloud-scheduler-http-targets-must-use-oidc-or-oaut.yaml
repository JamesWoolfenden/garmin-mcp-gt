id: HLD_GCP_201
name: Cloud Scheduler HTTP targets must use OIDC or OAuth token authentication
principle: identity-and-access
severity: MEDIUM
rationale: |
  Cloud Scheduler jobs that POST to HTTP endpoints without an OIDC or OAuth token
  send unauthenticated requests, allowing the target URL to receive calls that
  cannot be verified as originating from the scheduler. When the target is a
  Cloud Run service or other GCP-protected endpoint, omitting the token means
  the endpoint's IAM protection is bypassed or the request will be rejected
  silently, both of which indicate a misconfiguration.
remediation: |
  Add an oidc_token block (preferred for GCP targets) or oauth_token block to
  the http_target in your google_cloud_scheduler_job:

    http_target {
      uri         = google_cloud_run_v2_service.my_service.uri
      http_method = "POST"
      oidc_token {
        service_account_email = google_service_account.scheduler.email
        audience              = google_cloud_run_v2_service.my_service.uri
      }
    }
resources:
  google_cloud_scheduler_job:
    filter:
      path: http_target
      not_null: true
    any:
      - path: http_target.oidc_token
        not_null: true
      - path: http_target.oauth_token
        not_null: true
