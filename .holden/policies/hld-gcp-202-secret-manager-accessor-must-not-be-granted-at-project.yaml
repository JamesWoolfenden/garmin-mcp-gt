id: HLD_GCP_202
name: Secret Manager accessor must not be granted at project level
principle: identity-and-access
severity: MEDIUM
rationale: |
  Granting roles/secretmanager.secretAccessor at the project level gives a
  principal read access to every secret in the project, including secrets added
  in the future by other services. The correct scope is per-secret, using
  google_secret_manager_secret_iam_member for each secret the principal
  legitimately needs. A project-level grant violates least privilege and means
  any new secret is automatically readable by the grantee without a deliberate
  IAM decision.
remediation: |
  Replace the project-level grant with per-secret bindings:

    resource "google_secret_manager_secret_iam_member" "my_service_access" {
      for_each = {
        api_key = google_secret_manager_secret.api_key.id
        token   = google_secret_manager_secret.token.id
      }
      secret_id = each.value
      role      = "roles/secretmanager.secretAccessor"
      member    = "serviceAccount:${google_service_account.my_service.email}"
    }

  Remove the corresponding google_project_iam_member with role =
  "roles/secretmanager.secretAccessor".
resources:
  google_project_iam_member:
    path: role
    not_one_of:
      - "roles/secretmanager.secretAccessor"
      - "roles/secretmanager.admin"
  google_project_iam_binding:
    path: role
    not_one_of:
      - "roles/secretmanager.secretAccessor"
      - "roles/secretmanager.admin"
  google_folder_iam_member:
    path: role
    not_one_of:
      - "roles/secretmanager.secretAccessor"
      - "roles/secretmanager.admin"
  google_organization_iam_member:
    path: role
    not_one_of:
      - "roles/secretmanager.secretAccessor"
      - "roles/secretmanager.admin"
