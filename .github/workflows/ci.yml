name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check garmin_mcp.py

      - name: Format check
        run: uv run ruff format --check garmin_mcp.py

      - name: Check package builds
        run: uv build

      - name: Verify entry points importable
        run: uv run python -c "from garmin_mcp import main, _setup"
