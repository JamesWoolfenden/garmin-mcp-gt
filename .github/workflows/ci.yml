name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - run: uv run ruff check garmin_mcp.py
      - run: uv run ruff format --check garmin_mcp.py
      - run: uv build
      - run: uv run python -c "from garmin_mcp import main, _setup"

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install fastapi uvicorn httpx pytest pytest-asyncio pydantic
      - run: python -m pytest

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd ui && npm ci && npm test

  tofu:
    runs-on: ubuntu-latest
    concurrency:
      group: tofu-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.7.x"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.TERRAFORM_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Get internal secret
        id: secret
        run: echo "value=$(gcloud secrets versions access latest --secret fuel-internal-secret --project pike-477416)" >> $GITHUB_OUTPUT
      - name: tofu init
        run: tofu init
        working-directory: terraform
      - name: tofu plan
        if: github.event_name == 'pull_request'
        run: tofu plan -var="internal_secret=${{ steps.secret.outputs.value }}"
        working-directory: terraform
      - name: tofu apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: tofu apply -auto-approve -var="internal_secret=${{ steps.secret.outputs.value }}"
        working-directory: terraform

  deploy-backend:
    needs: [lint-and-build, test-python, test-frontend, tofu]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet
      - name: Build and push image
        run: |
          docker build -t gcr.io/pike-477416/fuel-backend backend/
          docker push gcr.io/pike-477416/fuel-backend
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy fuel-backend \
            --image gcr.io/pike-477416/fuel-backend \
            --platform managed \
            --region europe-west1 \
            --project pike-477416 \
            --allow-unauthenticated \
            --set-secrets="ANTHROPIC_API_KEY=anthropic-api-key:latest,GARMIN_API_SECRET=garmin-api-secret:latest,VAPID_PRIVATE_KEY=vapid-private-key:latest,INTERNAL_SECRET=fuel-internal-secret:latest" \
            --set-env-vars="GARMIN_SIDECAR_URL=https://fuel.wlfdn.dev,VAPID_EMAIL=james.woolfenden@gmail.com,LITESTREAM_GCS_BUCKET=pike-477416-sqlite" \
            --min-instances=0 \
            --max-instances=1 \
            --memory=512Mi \
            --timeout=30

  deploy-frontend:
    needs: [lint-and-build, test-python, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SA }}
      - name: Build
        run: cd ui && npm ci && npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - name: Deploy to Firebase Hosting
        run: cd ui && npx firebase-tools deploy --only hosting --project pike-477416 --force
